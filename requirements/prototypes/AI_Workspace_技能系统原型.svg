  <rect x="76" y="460" width="588" height="32" rx="6" fill="#f5f5f4"/>
  <text x="92" y="480" fill="#888780" font-size="9">🔒 安全策略：所有第三方技能安装前自动安全审计，P0 级风险需确认后方可启用</text>
