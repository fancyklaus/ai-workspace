  <line x1="26" y1="160" x2="30" y2="164" stroke="#534AB7" stroke-width="1.5"/>
  <line x1="30" y1="160" x2="26" y2="168" stroke="#534AB7" stroke-width="1.5"/>
  <text x="28" y="188" text-anchor="middle" fill="#534AB7" font-size="8" font-weight="500">技能</text>

