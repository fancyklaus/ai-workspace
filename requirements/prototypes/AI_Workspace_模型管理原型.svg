<svg viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    </style>
  </defs>
  <desc>AI Workspace 模型管理页面原型</desc>

  <rect width="680" height="420" fill="#f5f5f4" rx="8"/>

  <!-- 左侧导航 -->
  <rect x="0" y="0" width="56" height="420" fill="#1c1c1a" rx="8"/>
  <rect x="8" y="0" width="48" height="420" fill="#1c1c1a"/>
  <circle cx="28" cy="28" r="14" fill="#534AB7"/>
  <text x="28" y="33" text-anchor="middle" fill="white" font-size="14" font-weight="500">A</text>

  <!-- 导航项 - 模型选中 -->
  <rect x="14" y="210" width="28" height="28" rx="6" fill="#534AB7" opacity="0.15"/>
  <rect x="18" y="214" width="20" height="16" rx="3" fill="transparent" stroke="#534AB7" stroke-width="1.5"/>
  <line x1="22" y1="220" x2="34" y2="220" stroke="#534AB7" stroke-width="1"/>
  <circle cx="24" cy="224" r="1.5" fill="#534AB7"/>
  <text x="28" y="250" text-anchor="middle" fill="#534AB7" font-size="8" font-weight="500">模型</text>

  <!-- 主内容区 -->
  <rect x="56" y="0" width="624" height="420" fill="#ffffff"/>

  <!-- 页面标题 -->
  <text x="76" y="32" fill="#2c2c2a" font-size="15" font-weight="500">模型管理</text>
  <text x="76" y="48" fill="#888780" font-size="11">配置 LLM 供应商和 API Key，管理模型路由策略</text>

  <!-- 添加模型按钮 -->
  <rect x="560" y="16" width="100" height="28" rx="6" fill="#534AB7"/>
  <line x1="576" y1="30" x2="584" y2="30" stroke="white" stroke-width="1.5"/>
  <line x1="580" y1="26" x2="580" y2="34" stroke="white" stroke-width="1.5"/>
  <text x="592" y="34" fill="white" font-size="11" font-weight="500">添加模型</text>

  <!-- 供应商卡片 - OpenAI -->
  <rect x="76" y="64" width="290" height="140" rx="8" fill="#ffffff" stroke="#e5e5e0" stroke-width="0.5"/>
  <circle cx="100" cy="88" r="14" fill="#1c1c1a"/>
  <text x="100" y="93" text-anchor="middle" fill="white" font-size="10" font-weight="500">O</text>
  <text x="122" y="86" fill="#2c2c2a" font-size="13" font-weight="500">OpenAI</text>
  <text x="122" y="100" fill="#888780" font-size="10">api.openai.com</text>

  <rect x="284" y="78" width="56" height="18" rx="9" fill="#eaf3de"/>
  <text x="312" y="91" text-anchor="middle" fill="#3B6D11" font-size="9" font-weight="500">已连接</text>

  <text x="90" y="126" fill="#888780" font-size="9">API Key</text>
  <rect x="90" y="130" width="260" height="24" rx="4" fill="#f5f5f4"/>
  <text x="100" y="146" fill="#2c2c2a" font-size="10">sk-••••••••••••3Kx7</text>
  <text x="336" y="146" fill="#534AB7" font-size="9">编辑</text>

  <text x="90" y="174" fill="#888780" font-size="9">可用模型</text>
  <rect x="90" y="178" width="80" height="18" rx="4" fill="#e6f1fb"/>
  <text x="130" y="191" text-anchor="middle" fill="#185FA5" font-size="9">GPT-4o</text>
  <rect x="176" y="178" width="86" height="18" rx="4" fill="#e6f1fb"/>
  <text x="219" y="191" text-anchor="middle" fill="#185FA5" font-size="9">GPT-4o-mini</text>
  <rect x="268" y="178" width="80" height="18" rx="4" fill="#e6f1fb"/>
  <text x="308" y="191" text-anchor="middle" fill="#185FA5" font-size="9">o1-preview</text>

  <!-- 供应商卡片 - Claude -->
  <rect x="382" y="64" width="290" height="140" rx="8" fill="#ffffff" stroke="#e5e5e0" stroke-width="0.5"/>
  <circle cx="406" cy="88" r="14" fill="#534AB7"/>
  <text x="406" y="93" text-anchor="middle" fill="white" font-size="10" font-weight="500">C</text>
  <text x="428" y="86" fill="#2c2c2a" font-size="13" font-weight="500">Anthropic</text>
  <text x="428" y="100" fill="#888780" font-size="10">api.anthropic.com</text>

  <rect x="590" y="78" width="56" height="18" rx="9" fill="#eaf3de"/>
  <text x="618" y="91" text-anchor="middle" fill="#3B6D11" font-size="9" font-weight="500">已连接</text>

  <text x="396" y="126" fill="#888780" font-size="9">API Key</text>
  <rect x="396" y="130" width="260" height="24" rx="4" fill="#f5f5f4"/>
  <text x="406" y="146" fill="#2c2c2a" font-size="10">sk-ant-••••••••8mQ2</text>
  <text x="642" y="146" fill="#534AB7" font-size="9">编辑</text>

  <text x="396" y="174" fill="#888780" font-size="9">可用模型</text>
  <rect x="396" y="178" width="92" height="18" rx="4" fill="#cecbf6"/>
  <text x="442" y="191" text-anchor="middle" fill="#3C3489" font-size="9">Claude Sonnet 4</text>
  <rect x="494" y="178" width="92" height="18" rx="4" fill="#cecbf6"/>
  <text x="540" y="191" text-anchor="middle" fill="#3C3489" font-size="9">Claude Haiku 3.5</text>

  <!-- 供应商卡片 - 通义 -->
  <rect x="76" y="218" width="290" height="140" rx="8" fill="#ffffff" stroke="#e5e5e0" stroke-width="0.5"/>
  <circle cx="100" cy="242" r="14" fill="#D85A30"/>
  <text x="100" y="247" text-anchor="middle" fill="white" font-size="10" font-weight="500">Q</text>
  <text x="122" y="240" fill="#2c2c2a" font-size="13" font-weight="500">通义千问</text>
  <text x="122" y="254" fill="#888780" font-size="10">dashscope.aliyuncs.com</text>

  <rect x="284" y="232" width="56" height="18" rx="9" fill="#eaf3de"/>
  <text x="312" y="245" text-anchor="middle" fill="#3B6D11" font-size="9" font-weight="500">已连接</text>

  <text x="90" y="280" fill="#888780" font-size="9">API Key</text>
  <rect x="90" y="284" width="260" height="24" rx="4" fill="#f5f5f4"/>
  <text x="100" y="300" fill="#2c2c2a" font-size="10">sk-••••••••••••7pR9</text>
  <text x="336" y="300" fill="#534AB7" font-size="9">编辑</text>

  <text x="90" y="328" fill="#888780" font-size="9">可用模型</text>
  <rect x="90" y="332" width="90" height="18" rx="4" fill="#FAECE7"/>
  <text x="135" y="345" text-anchor="middle" fill="#712B13" font-size="9">Qwen-Max</text>
  <rect x="186" y="332" width="90" height="18" rx="4" fill="#FAECE7"/>
  <text x="231" y="345" text-anchor="middle" fill="#712B13" font-size="9">Qwen-Plus</text>

  <!-- 供应商卡片 - Ollama (本地) -->
  <rect x="382" y="218" width="290" height="140" rx="8" fill="#ffffff" stroke="#e5e5e0" stroke-width="0.5"/>
  <circle cx="406" cy="242" r="14" fill="#1D9E75"/>
  <text x="406" y="247" text-anchor="middle" fill="white" font-size="10" font-weight="500">L</text>
  <text x="428" y="240" fill="#2c2c2a" font-size="13" font-weight="500">Ollama (本地)</text>
  <text x="428" y="254" fill="#888780" font-size="10">localhost:11434</text>

  <rect x="590" y="232" width="56" height="18" rx="9" fill="#f7c1c1"/>
  <text x="618" y="245" text-anchor="middle" fill="#791f1f" font-size="9" font-weight="500">未连接</text>

  <text x="396" y="280" fill="#888780" font-size="9">服务地址</text>
  <rect x="396" y="284" width="260" height="24" rx="4" fill="#f5f5f4"/>
  <text x="406" y="300" fill="#2c2c2a" font-size="10">http://localhost:11434</text>
  <text x="642" y="300" fill="#534AB7" font-size="9">测试</text>

  <text x="396" y="328" fill="#888780" font-size="9">本地模型</text>
  <rect x="396" y="332" width="90" height="18" rx="4" fill="#E1F5EE"/>
  <text x="441" y="345" text-anchor="middle" fill="#085041" font-size="9">llama3.1:8b</text>
  <rect x="492" y="332" width="90" height="18" rx="4" fill="#E1F5EE"/>
  <text x="537" y="345" text-anchor="middle" fill="#085041" font-size="9">qwen2:7b</text>

  <!-- 模型路由策略 -->
  <rect x="76" y="372" width="596" height="40" rx="8" fill="#f5f5f4"/>
  <text x="90" y="396" fill="#2c2c2a" font-size="11" font-weight="500">智能路由</text>
  <text x="160" y="396" fill="#888780" font-size="10">代码任务 → Claude Sonnet 4 | 中文写作 → Qwen-Max | 快速问答 → GPT-4o-mini | 本地私有 → llama3.1</text>
  <text x="642" y="396" fill="#534AB7" font-size="9">配置</text>
</svg>