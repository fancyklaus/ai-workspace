<svg viewBox="0 0 680 460" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    </style>
  </defs>
  <desc>AI Workspace 工具市场与自动化页面原型</desc>

  <rect width="680" height="460" fill="#f5f5f4" rx="8"/>

  <!-- 左侧导航 -->
  <rect x="0" y="0" width="56" height="460" fill="#1c1c1a" rx="8"/>
  <rect x="8" y="0" width="48" height="460" fill="#1c1c1a"/>
  <circle cx="28" cy="28" r="14" fill="#534AB7"/>
  <text x="28" y="33" text-anchor="middle" fill="white" font-size="14" font-weight="500">A</text>

  <!-- 工具选中 -->
  <rect x="14" y="170" width="28" height="28" rx="6" fill="#534AB7" opacity="0.15"/>
  <circle cx="28" cy="184" r="8" fill="transparent" stroke="#534AB7" stroke-width="1.5"/>
  <line x1="28" y1="180" x2="28" y2="188" stroke="#534AB7" stroke-width="1.5"/>
  <line x1="24" y1="184" x2="32" y2="184" stroke="#534AB7" stroke-width="1.5"/>
  <text x="28" y="208" text-anchor="middle" fill="#534AB7" font-size="8" font-weight="500">工具</text>

  <!-- 主内容区 -->
  <rect x="56" y="0" width="624" height="460" fill="#ffffff"/>

  <!-- 标签页切换 -->
  <text x="76" y="28" fill="#2c2c2a" font-size="15" font-weight="500">工具与自动化</text>
  <rect x="76" y="38" width="56" height="2" rx="1" fill="#534AB7"/>
  <text x="76" y="56" fill="#534AB7" font-size="11" font-weight="500">内置工具</text>
  <text x="152" y="56" fill="#888780" font-size="11">工具市场</text>
  <text x="228" y="56" fill="#888780" font-size="11">定时任务</text>
  <text x="304" y="56" fill="#888780" font-size="11">自定义 Skill</text>

  <!-- 内置工具网格 -->
  <rect x="76" y="72" width="148" height="100" rx="8" fill="#ffffff" stroke="#e5e5e0" stroke-width="0.5"/>
  <rect x="88" y="84" width="28" height="28" rx="6" fill="#e6f1fb"/>
  <text x="102" y="103" text-anchor="middle" fill="#378ADD" font-size="14">F</text>
  <text x="124" y="96" fill="#2c2c2a" font-size="11" font-weight="500">文件操作</text>
  <rect x="124" y="100" width="38" height="14" rx="3" fill="#eaf3de"/>
  <text x="143" y="110" text-anchor="middle" fill="#3B6D11" font-size="8" font-weight="500">P0</text>
  <text x="88" y="132" fill="#888780" font-size="9">读取/写入/编辑/搜索</text>
  <text x="88" y="146" fill="#888780" font-size="9">支持文本、代码、配置</text>
  <text x="88" y="160" fill="#888780" font-size="9">文件权限白名单管控</text>

  <rect x="236" y="72" width="148" height="100" rx="8" fill="#ffffff" stroke="#e5e5e0" stroke-width="0.5"/>
  <rect x="248" y="84" width="28" height="28" rx="6" fill="#cecbf6"/>
  <text x="262" y="103" text-anchor="middle" fill="#534AB7" font-size="14">C</text>
  <text x="284" y="96" fill="#2c2c2a" font-size="11" font-weight="500">代码执行</text>
  <rect x="284" y="100" width="38" height="14" rx="3" fill="#eaf3de"/>
  <text x="303" y="110" text-anchor="middle" fill="#3B6D11" font-size="8" font-weight="500">P0</text>
  <text x="248" y="132" fill="#888780" font-size="9">Python / Node.js 沙箱</text>
  <text x="248" y="146" fill="#888780" font-size="9">隔离环境安全执行</text>
  <text x="248" y="160" fill="#888780" font-size="9">支持 pip/npm 安装依赖</text>

  <rect x="396" y="72" width="148" height="100" rx="8" fill="#ffffff" stroke="#e5e5e0" stroke-width="0.5"/>
  <rect x="408" y="84" width="28" height="28" rx="6" fill="#1c1c1a"/>
  <text x="422" y="103" text-anchor="middle" fill="white" font-size="14">T</text>
  <text x="444" y="96" fill="#2c2c2a" font-size="11" font-weight="500">终端命令</text>
  <rect x="444" y="100" width="38" height="14" rx="3" fill="#eaf3de"/>
  <text x="463" y="110" text-anchor="middle" fill="#3B6D11" font-size="8" font-weight="500">P0</text>
  <text x="408" y="132" fill="#888780" font-size="9">Shell 命令执行</text>
  <text x="408" y="146" fill="#888780" font-size="9">危险操作人工审批</text>
  <text x="408" y="160" fill="#888780" font-size="9">超时自动终止</text>

  <rect x="556" y="72" width="108" height="100" rx="8" fill="#ffffff" stroke="#e5e5e0" stroke-width="0.5"/>
  <rect x="568" y="84" width="28" height="28" rx="6" fill="#E1F5EE"/>
  <text x="582" y="103" text-anchor="middle" fill="#0F6E56" font-size="14">S</text>
  <text x="604" y="96" fill="#2c2c2a" font-size="11" font-weight="500">搜索</text>
  <rect x="604" y="100" width="38" height="14" rx="3" fill="#FAEEDA"/>
  <text x="623" y="110" text-anchor="middle" fill="#854F0B" font-size="8" font-weight="500">P1</text>
  <text x="568" y="132" fill="#888780" font-size="9">Web Search</text>
  <text x="568" y="146" fill="#888780" font-size="9">URL Fetch</text>
  <text x="568" y="160" fill="#888780" font-size="9">内容提取</text>

  <!-- 定时任务区域 -->
  <text x="76" y="200" fill="#2c2c2a" font-size="13" font-weight="500">定时任务</text>
  <rect x="580" y="186" width="84" height="24" rx="6" fill="#534AB7"/>
  <text x="592" y="202" fill="white" font-size="10" font-weight="500">新建任务</text>

  <rect x="76" y="212" width="588" height="48" rx="6" fill="#ffffff" stroke="#e5e5e0" stroke-width="0.5"/>
  <rect x="88" y="222" width="8" height="8" rx="4" fill="#639922"/>
  <text x="104" y="232" fill="#2c2c2a" font-size="11" font-weight="500">每日AI动态日报</text>
  <text x="104" y="246" fill="#888780" font-size="9">每天 08:00 | 抓取13个公众号最新文章，生成日报摘要</text>
  <rect x="420" y="226" width="68" height="18" rx="4" fill="#eaf3de"/>
  <text x="454" y="239" text-anchor="middle" fill="#3B6D11" font-size="9">运行中</text>
  <text x="504" y="238" fill="#888780" font-size="9">Cron: 0 8 * * *</text>
  <text x="636" y="238" fill="#534AB7" font-size="9">编辑</text>

  <rect x="76" y="266" width="588" height="48" rx="6" fill="#ffffff" stroke="#e5e5e0" stroke-width="0.5"/>
  <rect x="88" y="276" width="8" height="8" rx="4" fill="#639922"/>
  <text x="104" y="286" fill="#2c2c2a" font-size="11" font-weight="500">代码仓库健康检查</text>
  <text x="104" y="300" fill="#888780" font-size="9">每周一 09:00 | 检查依赖更新、安全漏洞、TODO 统计</text>
  <rect x="420" y="280" width="68" height="18" rx="4" fill="#eaf3de"/>
  <text x="454" y="293" text-anchor="middle" fill="#3B6D11" font-size="9">运行中</text>
  <text x="504" y="292" fill="#888780" font-size="9">Cron: 0 9 * * 1</text>
  <text x="636" y="292" fill="#534AB7" font-size="9">编辑</text>

  <rect x="76" y="320" width="588" height="48" rx="6" fill="#ffffff" stroke="#e5e5e0" stroke-width="0.5"/>
  <rect x="88" y="330" width="8" height="8" rx="4" fill="#d3d1c7"/>
  <text x="104" y="340" fill="#888780" font-size="11" font-weight="500">会议纪要自动整理</text>
  <text x="104" y="354" fill="#d3d1c7" font-size="9">每天 18:00 | 检查今日会议录音，自动转写整理纪要</text>
  <rect x="420" y="334" width="68" height="18" rx="4" fill="#f5f5f4"/>
  <text x="454" y="347" text-anchor="middle" fill="#888780" font-size="9">已暂停</text>
  <text x="504" y="346" fill="#d3d1c7" font-size="9">Cron: 0 18 * * *</text>
  <text x="636" y="346" fill="#534AB7" font-size="9">编辑</text>

  <!-- MCP 协议说明 -->
  <rect x="76" y="386" width="588" height="60" rx="8" fill="#cecbf6" opacity="0.2"/>
  <rect x="76" y="386" width="588" height="60" rx="8" fill="transparent" stroke="#cecbf6" stroke-width="0.5"/>
  <text x="92" y="408" fill="#3C3489" font-size="11" font-weight="500">MCP 工具协议</text>
  <text x="92" y="424" fill="#5F5E5A" font-size="10">支持 Model Context Protocol 标准协议，可接入外部工具服务（数据库、API、浏览器自动化等）</text>
  <text x="92" y="438" fill="#534AB7" font-size="9">查看文档 →</text>
  <text x="636" y="424" fill="#534AB7" font-size="9">配置</text>
</svg>